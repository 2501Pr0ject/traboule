[project]
name = "traboule"
version = "0.0.1"
description = "Moteur d'intelligence territoriale local-first sur la Métropole de Lyon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "polars>=1.0",
  "pyarrow>=16",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "traboule"
module-root = "packages"

[project.optional-dependencies]
spike = [
  "pymupdf>=1.24",
  "docling>=2.0",
  "FlagEmbedding>=1.2",
  "qdrant-client>=1.12",
  "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.22"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
